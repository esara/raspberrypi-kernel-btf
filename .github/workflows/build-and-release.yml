name: build and release BTF

on:
    schedule:
        - cron: "17 3 * * *"
    workflow_dispatch:
        inputs:
            kernel_branch:
                description: "raspberrypi/linux branch to build. Empty means the repository default branch."
                required: false
                default: ""
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: btf-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    source:
        runs-on: ubuntu-22.04
        permissions:
            contents: read
        outputs:
            kernel_commit: ${{ steps.source.outputs.kernel_commit }}
            short_commit: ${{ steps.source.outputs.short_commit }}
            kernel_branch: ${{ steps.source.outputs.kernel_branch }}
            tag_name: ${{ steps.source.outputs.tag_name }}
            release_exists: ${{ steps.release.outputs.exists }}
        steps:
            - name: Resolve Raspberry Pi kernel source
              id: source
              env:
                  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
              run: |
                  set -euo pipefail
                  clone_args=(clone --depth=1)
                  if [[ -n "${KERNEL_BRANCH}" ]]; then
                      clone_args+=(--branch "${KERNEL_BRANCH}")
                  fi
                  clone_args+=(https://github.com/raspberrypi/linux linux)
                  git "${clone_args[@]}"
                  cd linux
                  git fetch --unshallow || true && git checkout 7cfc41f8e80f11ffa8382ed1a505154ceffb79c7
                  kernel_commit="$(git rev-parse HEAD)"
                  short_commit="$(git rev-parse --short=12 HEAD)"
                  resolved_branch="$(git rev-parse --abbrev-ref HEAD)"
                  if [[ "${resolved_branch}" == "HEAD" ]]; then
                      resolved_branch="${KERNEL_BRANCH:-default}"
                  fi
                  tag_name="btf-${short_commit}"
                  {
                      echo "kernel_commit=${kernel_commit}"
                      echo "short_commit=${short_commit}"
                      echo "kernel_branch=${resolved_branch}"
                      echo "tag_name=${tag_name}"
                  } >> "${GITHUB_OUTPUT}"

            - name: Check for existing release
              id: release
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ steps.source.outputs.tag_name }}
              run: |
                  if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                      echo "exists=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "exists=false" >> "${GITHUB_OUTPUT}"
                  fi

    build:
        needs: source
        if: github.event_name == 'pull_request' || needs.source.outputs.release_exists != 'true'
        strategy:
            fail-fast: false
            matrix:
                target: [rpi4, rpi5]
        runs-on: ubuntu-22.04
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
            - uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v2

            - name: Show nix version
              run: nix --version

            - name: Set up nix dev env
              run: nix develop --command echo 0

            - name: Build ${{ matrix.target }} BTF
              env:
                  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
                  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
                  JOBS: 4
              run: nix develop --ignore-environment --keep KERNEL_BRANCH --keep JOBS --command ./scripts/build-btf.sh "${{ matrix.target }}"

            - name: Upload ${{ matrix.target }} BTF artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: btf-${{ matrix.target }}
                  path: dist/${{ matrix.target }}/*

    release:
        needs: [source, build]
        if: github.event_name != 'pull_request' && needs.source.outputs.release_exists != 'true'
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: artifacts

            - name: Display artifacts
              run: find artifacts -maxdepth 3 -type f -print

            - name: Write release notes
              env:
                  KERNEL_COMMIT: ${{ needs.source.outputs.kernel_commit }}
                  SHORT_COMMIT: ${{ needs.source.outputs.short_commit }}
                  KERNEL_BRANCH: ${{ needs.source.outputs.kernel_branch }}
              run: |
                  {
                      echo "Detached BTF blobs for raspberrypi/linux ${SHORT_COMMIT}."
                      echo
                      echo "Kernel repository: https://github.com/raspberrypi/linux"
                      echo "Kernel branch: ${KERNEL_BRANCH}"
                      echo "Kernel commit: ${KERNEL_COMMIT}"
                      echo
                      echo "Targets:"
                      echo "- rpi4: bcm2711_defconfig, arm64"
                      echo "- rpi5: bcm2712_defconfig, arm64"
                  } > release-notes.md

            - name: Create GitHub release
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
              with:
                  tag_name: ${{ needs.source.outputs.tag_name }}
                  name: raspberrypi/linux BTF ${{ needs.source.outputs.short_commit }}
                  body_path: release-notes.md
                  files: artifacts/**/*




                  
